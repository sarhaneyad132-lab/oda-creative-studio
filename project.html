
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details | ODA Creative Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8faff;
    color: #172033;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 8%;
    background: white;
    border-bottom: 1px solid #edf0f5;
}

.logo {
    font-size: 29px;
    font-weight: 900;
    color: #2563eb;
    text-decoration: none;
}

.back-link {
    color: #475467;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

.back-link:hover {
    color: #2563eb;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 65px 25px;
}

.breadcrumb {
    color: #98a2b3;
    font-size: 13px;
    margin-bottom: 30px;
}

.breadcrumb a {
    color: #2563eb;
    text-decoration: none;
}

.project-header {
    margin-bottom: 35px;
}

.category {
    display: inline-block;
    background: #eaf0ff;
    color: #2563eb;
    padding: 9px 15px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

.featured-badge {
    display: inline-block;
    margin-left: 8px;
    background: #172033;
    color: white;
    padding: 9px 13px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: bold;
}

h1 {
    font-size: 48px;
    margin-bottom: 18px;
    line-height: 1.2;
}

.project-description {
    color: #667085;
    font-size: 16px;
    line-height: 1.9;
    max-width: 750px;
}

.project-image {
    width: 100%;
    min-height: 300px;
    max-height: 600px;
    margin: 40px 0;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(135deg, #eaf0ff, #f8faff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.06);
}

.project-image img {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
}

.image-placeholder {
    color: #2563eb;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
}

.gallery-section {
    margin-top: 55px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 22px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.gallery-item {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #edf0f5;
    cursor: zoom-in;
    transition: 0.3s;
}

.gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.gallery-item img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 45px;
}

.detail-card {
    background: white;
    border: 1px solid #edf0f5;
    padding: 25px;
    border-radius: 15px;
}

.detail-card span {
    color: #98a2b3;
    font-size: 12px;
    display: block;
    margin-bottom: 10px;
}

.detail-card strong {
    font-size: 16px;
    color: #172033;
}

.bottom-action {
    margin-top: 60px;
    padding: 45px 25px;
    text-align: center;
    background: #edf3ff;
    border-radius: 20px;
}

.bottom-action h2 {
    font-size: 27px;
    margin-bottom: 12px;
}

.bottom-action p {
    color: #667085;
    line-height: 1.7;
}

.btn {
    display: inline-block;
    margin-top: 22px;
    padding: 14px 25px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: #1747b5;
    transform: translateY(-3px);
}

.status-message {
    max-width: 650px;
    margin: 100px auto;
    padding: 35px 25px;
    text-align: center;
}

.status-message h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

.status-message p {
    color: #667085;
    line-height: 1.8;
}

.loader {
    width: 42px;
    height: 42px;
    border: 4px solid #eaf0ff;
    border-top-color: #2563eb;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 35, 0.94);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 10px;
}

.lightbox-close {
    position: absolute;
    top: 20px;
    right: 28px;
    color: white;
    background: none;
    border: none;
    font-size: 38px;
    cursor: pointer;
}

footer {
    background: #172033;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    font-size: 13px;
}

@media(max-width: 600px) {
    header {
        padding: 20px;
    }

    .logo {
        font-size: 25px;
    }

    .back-link {
        font-size: 12px;
    }

    h1 {
        font-size: 35px;
    }

    .container {
        padding: 40px 20px;
    }

    .details,
    .gallery {
        grid-template-columns: 1fr;
    }

    .project-image {
        min-height: 220px;
    }

    .gallery-item img {
        height: 240px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">ODA.</a>
    <a href="index.html#portfolio" class="back-link">
        ← Back to Portfolio
    </a>
</header>

<main id="projectContent">
    <div class="status-message">
        <div class="loader"></div>
        <p>Loading project...</p>
    </div>
</main>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose"
        aria-label="Close image">&times;</button>
    <img id="lightboxImage" src="" alt="Project preview">
</div>

<footer>
    © 2026 ODA Creative Studio. All Rights Reserved.
</footer>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const content = document.getElementById("projectContent");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");

function showMessage(title, message) {
    content.innerHTML = "";

    const box = document.createElement("div");
    box.className = "status-message";

    const heading = document.createElement("h1");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = message;

    const link = document.createElement("a");
    link.href = "index.html#portfolio";
    link.className = "btn";
    link.textContent = "Back to Portfolio";

    box.append(heading, paragraph, link);
    content.appendChild(box);
}

function openLightbox(url, name) {
    lightboxImage.src = url;
    lightboxImage.alt = name || "Project image";
    lightbox.classList.add("active");
}

function closeLightbox() {
    lightbox.classList.remove("active");
    lightboxImage.src = "";
}

document.getElementById("lightboxClose")
    .addEventListener("click", closeLightbox);

lightbox.addEventListener("click", function(event) {
    if (event.target === lightbox) {
        closeLightbox();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeLightbox();
    }
});

function getImageUrl(item) {
    if (typeof item === "string") {
        return item;
    }

    if (item && typeof item === "object") {
        return item.url || item.image_url || item.src || "";
    }

    return "";
}

function getProjectImages(project) {
    let images = [];

    if (project.image_url) {
        images.push(project.image_url);
    }

    if (Array.isArray(project.images)) {
        project.images.forEach(function(item) {
            const url = getImageUrl(item);

            if (url) {
                images.push(url);
            }
        });
    }

    return [...new Set(images)];
}

function createImage(url, name, className) {
    const img = document.createElement("img");

    img.src = url;
    img.alt = name || "ODA Creative Studio project";
    img.loading = "lazy";

    img.addEventListener("click", function() {
        openLightbox(url, name);
    });

    if (className) {
        img.className = className;
    }

    return img;
}

function renderProject(project) {
    content.innerHTML = "";

    const container = document.createElement("div");
    container.className = "container";

    // Breadcrumb
    const breadcrumb = document.createElement("div");
    breadcrumb.className = "breadcrumb";
    breadcrumb.innerHTML =
        '<a href="index.html">Home</a> / ' +
        '<a href="index.html#portfolio">Portfolio</a> / Project';

    // Project header
    const header = document.createElement("div");
    header.className = "project-header";

    const category = document.createElement("span");
    category.className = "category";
    category.textContent =
        (project.category || "CREATIVE PROJECT").toUpperCase();

    header.appendChild(category);

    if (project.featured === true) {
        const badge = document.createElement("span");
        badge.className = "featured-badge";
        badge.textContent = "★ FEATURED PROJECT";
        header.appendChild(badge);
    }

    const title = document.createElement("h1");
    title.textContent = project.name || "Untitled Project";

    const description = document.createElement("p");
    description.className = "project-description";
    description.textContent =
        project.description ||
        "A creative project by ODA Creative Studio.";

    header.append(title, description);

    // Images
    const images = getProjectImages(project);

    const imageArea = document.createElement("div");
    imageArea.className = "project-image";

    if (images.length > 0) {
        imageArea.appendChild(
            createImage(images[0], project.name)
        );
    } else {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "ODA.";
        imageArea.appendChild(placeholder);
    }

    // Gallery
    let gallerySection = null;

    if (images.length > 1) {
        gallerySection = document.createElement("section");
        gallerySection.className = "gallery-section";

        const galleryTitle = document.createElement("h2");
        galleryTitle.className = "section-title";
        galleryTitle.textContent = "Project Gallery";

        const gallery = document.createElement("div");
        gallery.className = "gallery";

        images.slice(1).forEach(function(url) {
            const item = document.createElement("div");
            item.className = "gallery-item";

            item.appendChild(createImage(url, project.name));
            gallery.appendChild(item);
        });

        gallerySection.append(galleryTitle, gallery);
    }

    // Details
    const details = document.createElement("div");
    details.className = "details";

    const categoryCard = document.createElement("div");
    categoryCard.className = "detail-card";

    const categoryLabel = document.createElement("span");
    categoryLabel.textContent = "PROJECT CATEGORY";

    const categoryValue = document.createElement("strong");
    categoryValue.textContent =
        project.category || "Creative Project";

    categoryCard.append(categoryLabel, categoryValue);

    const studioCard = document.createElement("div");
    studioCard.className = "detail-card";

    const studioLabel = document.createElement("span");
    studioLabel.textContent = "CREATED BY";

    const studioValue = document.createElement("strong");
    studioValue.textContent = "ODA Creative Studio";

    studioCard.append(studioLabel, studioValue);

    details.append(categoryCard, studioCard);

    // Contact section
    const action = document.createElement("div");
    action.className = "bottom-action";
    action.innerHTML = `
        <h2>Have an idea?</h2>
        <p>Let's turn your next idea into something meaningful.</p>
        <a href="index.html#contact" class="btn">
            Work With ODA
        </a>
    `;

    container.append(breadcrumb, header, imageArea);

    if (gallerySection) {
        container.appendChild(gallerySection);
    }

    container.append(details, action);
    content.appendChild(container);
}

async function loadProject() {
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("id");

    if (!projectId) {
        showMessage(
            "Project Not Found.",
            "No project ID was provided."
        );
        return;
    }

    if (!window.odaSupabase) {
        showMessage(
            "Connection Error",
            "Could not connect to the project database. Please check the Supabase configuration."
        );
        return;
    }

    try {
        const { data, error } = await window.odaSupabase
            .from("projects")
            .select("id, name, category, description, image_url, images, featured, published")
            .eq("id", projectId)
            .eq("published", true)
            .maybeSingle();

        if (error) {
            console.error("Supabase project error:", error);

            showMessage(
                "Unable to Load Project",
                "There was a problem loading this project. Please try again."
            );
            return;
        }

        if (!data) {
            showMessage(
                "Project Not Found.",
                "This project may have been removed or is not currently published."
            );
            return;
        }

        renderProject(data);

        document.title =
            (data.name || "Project") + " | ODA Creative Studio";

    } catch (error) {
        console.error("Unexpected project error:", error);

        showMessage(
            "Something Went Wrong",
            "We couldn't load this project. Please try again later."
        );
    }
}

loadProject();
</script>

</body>
</html>
